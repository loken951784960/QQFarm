name: Build Rootless Deb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: rootless
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl python3 zip curl subversion dpkg-dev git-lfs

      - name: Set up Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Download iOS SDK (16.5)
        run: |
          mkdir -p $THEOS/sdks
          git lfs install
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          git lfs pull
          cp -r iPhoneOS16.5.sdk $THEOS/sdks/iPhoneOS16.5.sdk

      - name: Build rootless deb
        run: |
          make package FINALPACKAGE=1

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqfarm-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
