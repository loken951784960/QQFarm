name: Build Rootless Deb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: rootless
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl python3 zip curl subversion dpkg-dev git-lfs xz-utils

      - name: Set up Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid (Homebrew)
        run: |
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install ldid
          sudo cp "$(brew --prefix)/bin/ldid" /usr/local/bin/ldid
          ldid 2>&1 | head -1

      - name: Install iOS cross toolchain (Linux, public release)
        run: |
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz -o /tmp/tc.tar.xz
          mkdir -p "$THEOS/toolchain"
          tar -xJf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          rm -f /tmp/tc.tar.xz
          ls "$THEOS/toolchain/linux/iphone/bin/clang" && echo "toolchain OK"

      - name: Download iOS SDK (16.5)
        run: |
          mkdir -p $THEOS/sdks
          git lfs install
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          git lfs pull
          cp -r iPhoneOS16.5.sdk $THEOS/sdks/iPhoneOS16.5.sdk

      - name: Build rootless deb
        run: |
          make package FINALPACKAGE=1

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqfarm-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
